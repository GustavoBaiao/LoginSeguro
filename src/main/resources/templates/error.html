<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Erro', ~{::section})}">
<head><title>Erro</title></head>
<body>
<section class="card">
    <h1 th:text="${'Erro ' + status}">Erro</h1>
    <p th:switch="${status}">
        <span th:case="403">Você não tem permissão para realizar esta ação. Se o formulário expirou, recarregue a página.</span>
        <span th:case="404">A página solicitada não foi encontrada.</span>
        <span th:case="*">Não foi possível concluir esta solicitação.</span>
    </p>
    <a class="button" th:href="@{/}">Voltar ao início</a>
</section>
</body>
</html>
